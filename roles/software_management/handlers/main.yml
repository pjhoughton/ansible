
# Handlers for software_management role
- name: Reboot Linux system
  become: true
  ansible.builtin.reboot:
    reboot_timeout: 1800
    connect_timeout: 30
    post_reboot_delay: 30
    msg: "System reboot initiated by Ansible after software updates."
  listen: reboot_required
  when:
    - ansible_facts.get('os_family', '') != 'Windows'

 