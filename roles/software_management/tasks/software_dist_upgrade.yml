---
# Main tasks for software_management role

# ---------------------------------------------------------
# Debian / Ubuntu upgrade
# ---------------------------------------------------------
- name: Debian-based dist-upgrade and reboot check
  when: ansible_facts.get('distribution') in ['Ubuntu', 'Debian']
  block:

    - name: Perform dist-upgrade on Debian-based distros
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: full
        autoremove: true
        autoclean: true
        lock_timeout: 120
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: upgrade_results

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Set reboot required fact on Debian-based distros
      ansible.builtin.set_fact:
        reboot_required: "{{ reboot_required_file.stat.exists | default(false) }}"

    - name: Set patch success status
      ansible.builtin.set_fact:
        patch_successful: true


# ---------------------------------------------------------
# RedHat upgrade
# ---------------------------------------------------------
- name: Perform upgrade on Red Hat-based distros with yum
  ansible.builtin.yum:
    name: '*'
    state: latest
  when:
    - ansible_facts.get('os_family') == "RedHat"
    - (ansible_facts.get('distribution_major_version') | default(0) | int) < 8

- name: Perform upgrade on Red Hat-based distros with dnf
  ansible.builtin.dnf:
    name: '*'
    state: latest
  when:
    - ansible_facts.get('os_family') == "RedHat"
    - (ansible_facts.get('distribution_major_version') | default(0) | int) >= 8


